<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Case of the Golden Owl — A Detective Game About Evidence</title>
<meta name="description" content="A detective game about evidence: telling what your senses actually show from what your mind fills in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-900:#0c0e17; --ink-800:#141728; --ink-700:#1a1e33; --ink-600:#212640;
  --line:#2b3050; --line-soft:#232842;
  --paper:#f4ece0; --paper-2:#e9dfcd; --paper-edge:#cdbfa5; --paper-ink:#1c1a26; --paper-muted:#5d5670;
  --text:#e9e3d7; --muted:#8e93b4; --muted-2:#6d7295;
  --brass:#e6b53f; --brass-2:#f3cf78; --brass-dk:#8f6a14;
  --ev:#3ed6a5; --ev-dk:#15855f; --ev-glow:rgba(62,214,165,.14);
  --im:#ac88ff; --im-dk:#6c3fd0; --im-glow:rgba(172,136,255,.14);
  --err:#ff6f91; --err-dk:#b32b52;
  --disp:'Archivo Black','Arial Black',sans-serif;
  --ui:'Archivo',system-ui,-apple-system,sans-serif;
  --type:'Courier Prime','Courier New',monospace;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 4px 14px rgba(0,0,0,.35);
  --sh-3:0 14px 40px rgba(0,0,0,.45);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--ink-900);
  color:var(--text);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 500px at 15% -10%, rgba(230,181,63,.07), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(172,136,255,.06), transparent 55%);
  background-attachment:fixed;
}
.app{max-width:1120px;margin:0 auto;padding:0 20px 72px}
@media (max-width:600px){.app{padding:0 14px 56px}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(12,14,23,.92);backdrop-filter:blur(10px);
  margin:0 -20px;padding:14px 20px 0;border-bottom:1px solid var(--line-soft)}
@media (max-width:600px){.top{margin:0 -14px;padding:12px 14px 0}}
.top__row{display:flex;align-items:center;gap:14px;max-width:1080px;margin:0 auto}
.crest{width:40px;height:40px;border-radius:50%;border:2px solid var(--brass);color:var(--brass);
  display:grid;place-items:center;flex:0 0 auto;background:radial-gradient(circle at 35% 25%,rgba(230,181,63,.22),transparent 70%)}
@media (max-width:600px){.crest{display:none}}
.wordmark{min-width:0}
.wordmark .name{font-family:var(--disp);font-size:clamp(13px,2.4vw,15px);letter-spacing:.06em;color:var(--brass);
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark .sub{font-family:var(--type);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-top:2px}
.top__right{margin-left:auto;display:flex;align-items:center;gap:14px;flex:0 0 auto}
.counter{font-family:var(--type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.counter{font-size:11px;letter-spacing:.04em}}
.iconbtn{background:var(--ink-700);border:1px solid var(--line);color:var(--text);width:40px;height:40px;
  border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.iconbtn:hover{border-color:var(--brass);color:var(--brass)}
.iconbtn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.iconbtn svg{display:block}
.track{display:flex;gap:4px;margin-top:13px;padding-bottom:1px}
.track i{flex:1 1 0;height:4px;border-radius:2px;background:var(--line-soft);transition:background .45s var(--ease)}
.track i.on{background:linear-gradient(90deg,var(--brass-dk),var(--brass))}

/* ---------- surfaces ---------- */
.panel{background:linear-gradient(180deg,var(--ink-800),var(--ink-700));border:1px solid var(--line);
  border-radius:var(--r-lg);padding:clamp(22px,4vw,40px);margin-top:26px;box-shadow:var(--sh-2)}
.filestrip{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--type);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding-bottom:16px;margin-bottom:22px;
  border-bottom:1px solid var(--line-soft)}
.filestrip b{color:var(--brass);font-weight:400}
.filestrip .open{color:var(--err)}

h1{font-family:var(--disp);font-size:clamp(28px,5.2vw,48px);line-height:1.05;letter-spacing:-.01em;margin:0 0 16px;max-width:19ch}
h1 em{font-style:normal;color:var(--brass)}
h2{font-family:var(--disp);font-size:clamp(18px,2.6vw,24px);line-height:1.2;margin:0 0 12px;letter-spacing:.01em}
p{font-family:var(--type);font-size:15.5px;line-height:1.7;color:#ded6c6;margin:0 0 14px;max-width:68ch}
p b{color:var(--paper)}
.small{font-size:12.5px;color:var(--muted);letter-spacing:.02em}

.btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--brass-2),var(--brass));
  color:#241a04;border:none;font-family:var(--disp);font-size:15px;letter-spacing:.02em;padding:15px 26px;
  border-radius:var(--r-md);cursor:pointer;box-shadow:0 2px 0 var(--brass-dk),var(--sh-2);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04);box-shadow:0 3px 0 var(--brass-dk),var(--sh-3)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--brass-dk)}
.btn:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.btn svg{opacity:.8}

/* ---------- legend ---------- */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
@media (max-width:720px){.legend{grid-template-columns:1fr}}
.legend > div{border:1px solid;border-radius:var(--r-md);padding:18px;background:var(--ink-900)}
.legend .ev{border-color:rgba(62,214,165,.45);box-shadow:inset 0 0 0 1px rgba(62,214,165,.08),0 0 28px -18px var(--ev)}
.legend .im{border-color:rgba(172,136,255,.45);box-shadow:inset 0 0 0 1px rgba(172,136,255,.08),0 0 28px -18px var(--im)}
.legend>div>b{font-family:var(--disp);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;margin-bottom:9px}
.legend p b{color:var(--paper);font-weight:700}
.legend .ev>b{color:var(--ev)} .legend .im>b{color:var(--im)}
.legend p{font-size:14px;line-height:1.6;margin:0;color:var(--muted)}

/* ---------- story artwork ---------- */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.art{display:block}
.art--hero{width:100%;height:auto;border-radius:var(--r-md);background:linear-gradient(180deg,#0a0c16,#131629);
  border:1px solid var(--line);margin:0 0 26px}
.art--reveal{width:100%;max-width:420px;height:auto;border-radius:var(--r-md);
  background:linear-gradient(180deg,#0a0c16,#131629);border:1px solid var(--line);margin:0 0 22px}
.art--owl{width:74px;height:92px;flex:0 0 auto;--a1:#3a2a05;--a2:var(--brass);--a3:#fbf3dd}
.figure{display:flex;align-items:center;gap:18px;margin:0 0 18px}

/* ---------- atmosphere ---------- */
@keyframes drift{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
@keyframes twinkle{0%,100%{opacity:.18}50%{opacity:.8}}
@keyframes flicker{0%,100%{opacity:1}42%{opacity:.86}46%{opacity:1}72%{opacity:.92}}
@keyframes rise{0%{transform:translateY(6px);opacity:0}30%{opacity:.6}100%{transform:translateY(-22px);opacity:0}}
@keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.07)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(130% 100% at 50% 12%,transparent 46%,rgba(0,0,0,.42) 100%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ---------- thought banner ---------- */
.thought::after{content:"";position:absolute;left:30px;bottom:-13px;width:17px;height:17px;border-radius:50%;
  background:var(--paper-2);box-shadow:-19px 17px 0 -4.5px var(--paper-2)}

/* ---------- scene vignettes ---------- */
.art--spot{width:116px;height:134px;flex:0 0 auto;transform:rotate(1.6deg);
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
@media (max-width:760px){.art--spot{width:92px;height:106px}}
@media (max-width:480px){.art--spot{width:74px;height:85px}}

/* ---------- bins ---------- */
.bin__head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
/* Grid items default to min-width:auto, so the bin artwork would set a floor
   on each column and push the board wider than the screen. */
.board>*{min-width:0}
.bin__head>div{min-width:0}
.bin h3{flex-wrap:wrap}
.art--bin{width:74px;height:56px;flex:0 0 auto;opacity:.9}
.bin.ev .art--bin{--a1:var(--ev);--a2:var(--ev)}
.bin.im .art--bin{--a1:var(--im);--a2:var(--im)}
@media (max-width:860px){.art--bin{width:48px;height:36px}}
@media (max-width:540px){.art--bin{display:none}}

/* ---------- sense badge on a filed clue ---------- */
.sense{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:9px;
  letter-spacing:.13em;padding:4px 9px;border-radius:999px;margin-top:11px}
.sense svg{width:13px;height:13px}
.sense--ev{color:var(--ev-dk);background:rgba(21,133,95,.13)}
.sense--im{color:var(--im-dk);background:rgba(108,63,208,.13)}

/* ---------- case board ---------- */
.art--board{width:100%;height:auto;border-radius:var(--r-md);margin:6px 0 22px;box-shadow:var(--sh-3)}

/* ---------- thought banner ---------- */
.thought{position:relative;display:flex;align-items:center;gap:22px;
  background:linear-gradient(180deg,var(--paper),var(--paper-2));color:var(--paper-ink);
  border-radius:var(--r-md);padding:22px 26px 24px;margin-top:24px;box-shadow:var(--sh-3);
  border-left:6px solid var(--brass);animation:slide .35s var(--ease)}
.thought__text{flex:1 1 auto;min-width:0}
.thought .lbl{font-family:var(--type);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--paper-muted);margin-bottom:8px}
.thought .q{font-family:var(--disp);font-size:clamp(19px,3.2vw,29px);line-height:1.22;letter-spacing:-.005em;max-width:30ch}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- board ---------- */
.board{display:grid;gap:16px;margin-top:30px;align-items:start;
  grid-template-columns:1fr 1.1fr 1fr;grid-template-areas:"ev pile im"}
@media (max-width:860px){
  .board{grid-template-columns:1fr 1fr;grid-template-areas:"pile pile" "ev im";gap:12px}
}
.col-pile{grid-area:pile}
.bin{border:1.5px solid;border-radius:var(--r-md);padding:16px;min-height:170px;background:var(--ink-800);
  cursor:pointer;transition:background .18s,box-shadow .18s,border-color .18s,transform .18s}
.bin.ev{border-color:rgba(62,214,165,.4);grid-area:ev}
.bin.im{border-color:rgba(172,136,255,.4);grid-area:im}
@media (max-width:860px){.bin{min-height:auto;padding:13px}}
.bin.armed.ev{border-color:var(--ev);box-shadow:0 0 0 3px var(--ev-glow)}
.bin.armed.im{border-color:var(--im);box-shadow:0 0 0 3px var(--im-glow)}
.bin.over{background:var(--ink-600);transform:translateY(-2px)}
.bin.over.ev{box-shadow:0 0 0 4px var(--ev-glow),0 0 32px -12px var(--ev)}
.bin.over.im{box-shadow:0 0 0 4px var(--im-glow),0 0 32px -12px var(--im)}
.bin h3{font-family:var(--disp);font-size:13px;letter-spacing:.12em;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.bin.ev h3{color:var(--ev)} .bin.im h3{color:var(--im)}
.bin .def{font-family:var(--type);font-size:12px;line-height:1.5;color:var(--muted-2);margin:0 0 12px}
@media (max-width:860px){.bin .def{display:none}}
.stack{display:flex;flex-direction:column;gap:10px}
.pilelabel{font-family:var(--type);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);
  text-align:center;margin:0 0 10px}
.ph{border:1.5px dashed var(--line);border-radius:var(--r-sm);background:rgba(255,255,255,.025)}
.hint{font-family:var(--type);font-size:12px;line-height:1.6;color:var(--muted-2);text-align:center;margin:14px 0 0}

/* ---------- clue cards ---------- */
.card{position:relative;color:var(--paper-ink);
  background:
    repeating-linear-gradient(94deg,rgba(120,105,80,.035) 0 2px,transparent 2px 7px),
    linear-gradient(180deg,var(--paper),var(--paper-2));
  border-radius:var(--r-sm);border-top:3px solid var(--paper-edge);padding:14px 16px;font-family:var(--type);
  font-size:14.5px;line-height:1.55;cursor:grab;box-shadow:var(--sh-2);touch-action:none;user-select:none;
  transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-3)}
.card:focus-visible,.card.sel{outline:3px solid var(--brass);outline-offset:3px}
.card.sel{transform:translateY(-2px) rotate(-.6deg)}
.card.dragging{position:fixed;z-index:999;pointer-events:none;cursor:grabbing;
  transform:rotate(-2.5deg) scale(1.03);box-shadow:0 24px 44px rgba(0,0,0,.55);width:min(300px,76vw)}
.card.filed{cursor:default;font-size:13.5px;padding-top:40px;animation:land .3s var(--ease)}
.card.filed:hover{transform:none;box-shadow:var(--sh-2)}
@keyframes land{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.card .mark{position:absolute;top:10px;left:16px;font-family:var(--disp);font-size:10px;letter-spacing:.14em;
  border:2px solid;border-radius:4px;padding:3px 8px;transform:rotate(-2deg);animation:stampin .3s var(--ease)}
.card.ok{border-top-color:var(--ev-dk)}
.card.bad{border-top-color:var(--err-dk)}
.card.ok .mark{color:var(--ev-dk);border-color:var(--ev-dk);background:rgba(21,133,95,.08)}
.card.bad .mark{color:var(--err-dk);border-color:var(--err-dk);background:rgba(179,43,82,.07)}
.card .why{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,0,0,.22);
  font-size:12.5px;line-height:1.55;color:var(--paper-muted)}
@keyframes stampin{0%{transform:rotate(-2deg) scale(1.7);opacity:0}60%{opacity:1}100%{transform:rotate(-2deg) scale(1);opacity:1}}

/* ---------- ruled out ---------- */
.ruled{margin-top:20px;border:1px solid rgba(62,214,165,.45);border-radius:var(--r-lg);padding:24px;
  background:linear-gradient(180deg,#132a24,#101f1c);animation:slide .4s var(--ease);box-shadow:var(--sh-2)}
.ruled .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);color:var(--ev);font-size:12px;
  letter-spacing:.18em;margin-bottom:12px}
.ruled ul{margin:12px 0 20px;padding-left:20px}
.ruled li{font-family:var(--type);font-size:14.5px;line-height:1.65;margin-bottom:6px;color:#dbe8e2}
.ruled li::marker{color:var(--ev)}

/* ---------- closing ---------- */
.stamp{display:inline-block;font-family:var(--disp);font-size:clamp(20px,4vw,34px);letter-spacing:.06em;
  color:var(--ev);border:4px double var(--ev);border-radius:6px;padding:8px 20px;transform:rotate(-3deg);
  animation:stampin .45s var(--ease);margin:0 0 22px}
.notebook{background-color:var(--paper);color:var(--paper-ink);border-radius:var(--r-md);
  padding:20px 26px 20px 40px;margin:14px 0 20px;box-shadow:var(--sh-2);
  background-image:repeating-linear-gradient(transparent 0 27px,rgba(120,105,80,.22) 27px 28px)}
.notebook li{font-family:var(--type);font-size:13.5px;line-height:28px}
.notebook li::marker{color:var(--paper-muted);font-size:12px}
.scorecard{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:baseline;margin:20px 0 6px}
.scorecard .n{font-family:var(--disp);font-size:34px;color:var(--brass);line-height:1}
.meter{height:8px;background:var(--ink-900);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 18px;max-width:520px}
.meter i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--brass),var(--ev));transition:width 1s var(--ease)}
.rule{height:1px;background:var(--line-soft);margin:28px 0 24px;border:0}

.footnote{margin-top:30px;padding-top:18px;border-top:1px solid var(--line-soft)}
.footnote h3{font-family:var(--disp);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);margin:0 0 10px}
.footnote p{font-size:13px;line-height:1.65;color:var(--muted);max-width:74ch;margin:0 0 9px}
.footnote b{color:var(--text)}

.footer{margin-top:34px;text-align:center}
.footer a{display:inline-flex;align-items:center;gap:8px;color:var(--muted-2);font-family:var(--type);font-size:13px;
  letter-spacing:.06em;text-decoration:none;padding:8px 14px;border-radius:8px;transition:color .15s,background .15s}
.footer a:hover{color:var(--brass);background:var(--ink-800)}
.footer a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:1000}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

<symbol id="a-owl" viewBox="0 0 160 200">
  <rect x="30" y="184" width="100" height="12" rx="2.5" fill="var(--a2)"/>
  <rect x="40" y="170" width="80" height="14" rx="2" fill="var(--a2)" opacity=".82"/>

  <path d="M80 32c-26 0-43 28-43 63 0 41 19 68 43 68V32z" fill="var(--a1)" opacity=".1"/>
  <path d="M104 52c9 13 14 29 14 45 0 27-8 48-21 59 17-9 26-32 26-61 0-17-7-33-19-43z" fill="#fff3d2" opacity=".5"/>
  <circle cx="62" cy="74" r="16.5" fill="var(--a3)"/>

  <circle cx="62" cy="74" r="7.5" fill="var(--a1)"/>
  <circle cx="98" cy="74" r="7.5" fill="var(--a1)"/>
  <circle cx="59.5" cy="71" r="2.4" fill="var(--a3)"/>
  <circle cx="95.5" cy="71" r="2.4" fill="var(--a3)"/>
  <path d="M80 88 72.5 102h15z" fill="var(--a1)"/>
  <g stroke="var(--a1)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".38">
    <path d="M49 116q31 16 62 0"/><path d="M52 132q28 15 56 0"/><path d="M57 147q23 12 46 0"/>
  </g>
  <g stroke="var(--a1)" stroke-width="3.6" stroke-linecap="round" opacity=".5">
    <path d="M67 161v8"/><path d="M80 162v8"/><path d="M93 161v8"/>
  </g>
</symbol>

<!-- ===== The detective ===== -->
<symbol id="a-detective" viewBox="0 0 140 200">
  <path d="M22 134c0-27 20-42 48-42s48 15 48 42l4 64H18z" fill="var(--a2)"/>
  <path d="M52 97 43 128l11 2z" fill="var(--a1)" opacity=".3"/>
  <path d="M88 97l9 31-11 2z" fill="var(--a1)" opacity=".3"/>
  <path d="M70 92 51 122l19 14 19-14z" fill="var(--a1)" opacity=".45"/>

/* Inline animations live on the sprite originals, which <use> clones. Document

/* ---------- audio ---------- */
let AC=null, muted=false;
const bgm=document.getElementById('bgm');
bgm.volume=0;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,type,v,delay){
  if(muted)return; const c=ac(); if(!c)return; const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v||.08,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05);
}
const S={
  click:()=>tone(560,.05,'triangle',.035),
  lift:()=>tone(420,.06,'sine',.03),
  good:()=>[659,880,1175].forEach((f,i)=>tone(f,.22,'triangle',.055,i*.05)),
  bad:()=>{tone(180,.18,'sine',.06);tone(120,.24,'sine',.045,.05);},
  whoosh:()=>[320,440,580,720].forEach((f,i)=>tone(f,.12,'sine',.028,i*.028)),
  solved:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.055,i*.075)),
  fanfare:()=>{[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.42,'triangle',.06,i*.1));tone(196,.9,'sine',.04,.08);}
};
/* Fade the soundtrack in so it never jumps on the first note. */
function startMusic(){
  if(muted)return;
  const target=.28;
  bgm.play().then(()=>{
    const step=()=>{ if(muted||bgm.volume>=target-.005){bgm.volume=muted?0:target;return;}
      bgm.volume=Math.min(target,bgm.volume+.012); setTimeout(step,45); };
    step();
  }).catch(()=>{});
}
const muteBtn=document.getElementById('mute');
muteBtn.innerHTML=ICON.on;
muteBtn.addEventListener('click',()=>{
  muted=!muted;
  muteBtn.innerHTML=muted?ICON.off:ICON.on;
  muteBtn.setAttribute('aria-pressed',String(muted));
  muteBtn.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');
  bgm.muted=muted;
  if(!muted){ ac(); S.click(); if(bgm.paused) startMusic(); else if(bgm.volume<.05) startMusic(); }
});

/* ---------- confetti ---------- */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let bits=[], raf=null;
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#e6b53f','#f3cf78','#3ed6a5','#ac88ff','#f4ece0'];
  for(let i=0;i<n;i++) bits.push({
    x:innerWidth/2+(Math.random()-.5)*240, y:innerHeight*.36,
    vx:(Math.random()-.5)*13, vy:-Math.random()*13-4,
    r:Math.random()*5+3, c:cols[i%cols.length],
    a:Math.random()*6, va:(Math.random()-.5)*.35, life:110+Math.random()*60
  });
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits=bits.filter(b=>b.life-->0);
  bits.forEach(b=>{
    b.vy+=.32; b.x+=b.vx; b.y+=b.vy; b.a+=b.va;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.a);
    cx.globalAlpha=Math.min(1,b.life/40); cx.fillStyle=b.c;
    cx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2); cx.restore();
  });
  raf = bits.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

/* ---------- state ---------- */
const stage=document.getElementById('stage');
const counter=document.getElementById('counter');
const track=document.getElementById('track');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setProgress(done){

}

function clearArm(){document.querySelectorAll('.bin').forEach(b=>b.classList.remove('armed','over'));}
function binAt(x,y){const n=document.elementFromPoint(x,y);return n?n.closest('.bin'):null;}

const HINT='Drag a clue into a bin, or tap the clue and then tap a bin.<br>Keyboard: \u2190 evidence, \u2192 imagination.';
function setHint(html){const h=document.getElementById('hint'); if(h) h.innerHTML=html;}

/* On narrow screens the bins sit below the clue list and can be off-screen.
   Scroll just far enough to expose them, keeping their top clear of the
   sticky header. A dragged card is fixed to the pointer, so moving the page
   underneath it is safe. */
function revealBins(smooth){
  if(!matchMedia('(max-width:860px)').matches) return;
  const bin=document.getElementById('binE'); if(!bin) return;
  const r=bin.getBoundingClientRect();
  const by=Math.min(r.bottom-(innerHeight-16), Math.max(0,r.top-76));
  if(by>1) scrollBy({top:by,behavior:smooth?'smooth':'auto'});
}

function select(el){
  document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  document.querySelectorAll('.bin').forEach(b=>b.classList.add('armed'));
}

/* Restore a card that was mid-drag to its resting state in the pile. */
function undrag(el){
  el.classList.remove('dragging');
  el.style.left=''; el.style.top=''; el.style.width='';
}

function wire(el){
  let sx=0,sy=0,pid=null,drag=false,hover=null,ox=0,oy=0,ph=null;

  function stop(){
    pid=null; drag=false;
    if(ph){ph.remove(); ph=null;}
    if(hover){hover.classList.remove('over'); hover=null;}
    undrag(el); clearArm();
  }

  el.addEventListener('pointerdown',e=>{
    /* Ignore a second finger: without this the shared drag state gets
       crossed and an out-of-order release can strand the card mid-drag. */
    if(el.classList.contains('filed')||pid!==null)return;
    pid=e.pointerId; sx=e.clientX; sy=e.clientY;
    try{el.setPointerCapture(e.pointerId);}catch(_){}
  });

  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    if(!drag && Math.hypot(e.clientX-sx,e.clientY-sy)>7){
      drag=true;
      const r=el.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
      /* Hold the card's slot open. Lifting it out of the flow would otherwise
         collapse the pile and slide the bins up out from under the pointer,
         so the drop lands where the bin used to be and nothing happens. */
      ph=document.createElement('div');
      ph.className='ph'; ph.style.height=r.height+'px';
      el.parentNode.insertBefore(ph,el);
      el.style.width=r.width+'px';
      el.classList.add('dragging');
      document.querySelectorAll('.bin').forEach(b=>b.classList.add('armed'));
      S.lift(); revealBins(false);
    }
    if(drag){
      el.style.left=(e.clientX-ox)+'px'; el.style.top=(e.clientY-oy)+'px';
      const b=binAt(e.clientX,e.clientY);
      if(b!==hover){ if(hover)hover.classList.remove('over'); hover=b; if(hover)hover.classList.add('over'); }
    }
  });

  el.addEventListener('pointerup',e=>{
    if(e.pointerId!==pid)return;
    const wasDrag=drag;
    const bin=wasDrag?binAt(e.clientX,e.clientY):null;
    stop();
    if(wasDrag){
      if(bin) file(el,bin.dataset.s);
      else {
        /* Released short of a bin. Keep the clue in hand -- selected, with
           both bins lit -- so the next tap files it. */
        select(el); S.click();
        setHint('Not quite in a bin. Tap <b>Evidence</b> or <b>Imagination</b> to file it.');
        revealBins(true);
      }
    } else {
      const was=el.classList.contains('sel');
      document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));
      if(!was){ select(el); S.click(); revealBins(true); }
      else clearArm();
    }
  });

  el.addEventListener('pointercancel',e=>{ if(e.pointerId===pid) stop(); });
  /* Safari can revoke capture mid-gesture without sending pointercancel. */
  el.addEventListener('lostpointercapture',e=>{ if(e.pointerId===pid) stop(); });

  el.addEventListener('keydown',e=>{
    if(el.classList.contains('filed'))return;
    if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();file(el,'E');}
    else if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();file(el,'I');}
  });
}

/* Last-resort sweep: if a pointer ends anywhere and a card is still flagged
   as dragging, it was stranded by an event the card never received. Put it
   back rather than leave it pinned to the screen with the round unfinishable. */
['pointerup','pointercancel','touchend','touchcancel'].forEach(t=>
  window.addEventListener(t,()=>setTimeout(()=>{
    const stray=document.querySelectorAll('.card.dragging');
    if(!stray.length)return;
    stray.forEach(undrag);
    document.querySelectorAll('.ph').forEach(n=>n.remove());
    if(!document.querySelector('.card.sel')) clearArm();
  },0)));

function file(el,side){
  if(el.classList.contains('filed'))return;
  const d=THOUGHTS[st.i], c=d.cards[+el.dataset.idx], ok=c.s===side;
  st.total++; if(ok) st.right++;
  el.classList.remove('sel'); clearArm();
  el.classList.add('filed', ok?'ok':'bad');
  const label = c.s==='E' ? 'EVIDENCE' : 'IMAGINATION';
  el.removeAttribute('role'); el.removeAttribute('aria-label'); el.tabIndex=-1;
  el.innerHTML='<span class="mark">'+(ok?'CORRECT':'ACTUALLY '+label)+'</span>'+esc(c.t)+
               '<span class="why">'+esc(c.why)+'</span>'+
               '<span class="sense sense--'+(c.s==='E'?'ev':'im')+'">'+
                 '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-'+c.sense+'"/></svg>'+
                 SENSE[c.sense]+'</span>';
  document.getElementById(c.s==='E'?'stackE':'stackI').appendChild(el);
  setHint(HINT);
  ok?S.good():S.bad();
  say((ok?'Correct. ':'Not quite. That one is '+label.toLowerCase()+'. ')+c.why);
  const next=document.querySelector('#pile .card');
  if(next) next.focus({preventScroll:true});
  else ruledOut();
}

function ruledOut(){
  const d=THOUGHTS[st.i];
  document.getElementById('hint').textContent='';
  const ev=d.cards.filter(c=>c.s==='E').map(c=>'<li>'+esc(c.t)+'</li>').join('');
  const last = st.i===THOUGHTS.length-1;
  setProgress(st.i+1);
  document.getElementById('after').innerHTML=
    '<div class="ruled">'+
      '<div class="tag">'+ICON.check+' THOUGHT CHECKED</div>'+
      '<p style="margin-bottom:0"><b>What the evidence shows:</b> '+esc(d.fact)+'</p>'+
      '<ul>'+ev+'</ul>'+
      '<button class="btn" id="next">'+(last?'Solve the case':'Next thought')+' '+ICON.arrow+'</button>'+
    '</div>';
  S.solved(); confetti(40);
  say('Thought checked. '+d.fact);
  const btn=document.getElementById('next');
  btn.focus({preventScroll:true});
  document.getElementById('after').scrollIntoView({behavior:'smooth',block:'nearest'});
  btn.onclick=()=>{ S.whoosh(); if(last) final(); else { st.i++; round(); window.scrollTo({top:0,behavior:'smooth'}); } };
}

    '</div>'+
    '<div class="meter"><i id="bar"></i></div>'+

    '<h2 style="margin-top:28px">What counts as evidence</h2>'+

    '<p style="margin-top:26px"><button class="btn" id="again">Play again</button></p>'+
    '<div class="footnote">'+
      '<h3>A note on \u201cevidence\u201d</h3>'+
      '<p>The distinction this game teaches \u2014 <b>evidence is information gathered through the senses; imagination is information created in the mind</b> \u2014 comes from <b>inference-based CBT (I-CBT)</b>, the model developed for OCD. It holds that obsessional doubt is generated by imagination rather than by anything in the here and now, so the remedy is to trust what the senses actually report.</p>'+
      '<p>That is narrower than <b>classic (Beckian) CBT</b>, which asks \u201cwhat is the evidence for and against this thought?\u201d and counts past experience, base rates and other people\u2019s reports as evidence too. Both separate fact from interpretation; only I-CBT draws the line at the senses and frames the question as real versus imagined.</p>'+
      '<p>The game deliberately teaches the I-CBT version without naming the model, so the idea stays about evidence rather than about a treatment.</p>'+
    '</div>'+
  '</section>';
